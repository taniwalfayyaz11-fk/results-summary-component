<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="flc">
      <div class="boxone">
        <h1>Your Result</h1>
        <div class="circle">
          <h2>76</h2>
          <h3>of 100</h3>
        </div>
        <strong>Great</strong>
        <p>
          You scored higher than 65% of <br />
          <span class="people">the people who have taken </span> <br />
          <span class="test">these test.</span>
        </p>
      </div>

      <div class="boxtwo">
        <h4>Summary</h4>
        <div class="all">
          <div class="react">
            <div class="flex">
              <img src="images/icon-reaction.svg" alt="" />
              <h5>Reaction</h5>
            </div>
            <div class="grades"><strong>80</strong> / 100</div>
          </div>

          <div class="memory">
            <div class="flex">
              <img src="images/icon-memory.svg" alt="" />
              <h5>Memory</h5>
            </div>
            <div class="grades"><strong>92</strong> / 100</div>
          </div>

          <div class="verbal">
            <div class="flex">
              <img src="images/icon-verbal.svg" alt="" />
              <h5>Verbal</h5>
            </div>
            <div class="grades"><strong>61</strong> / 100</div>
          </div>

          <div class="visual">
            <div class="flex">
              <img src="images/icon-visual.svg" alt="" />
              <h5>Visual</h5>
            </div>
            <div class="grades"><strong>73</strong> / 100</div>
          </div>
        </div>

        <button><a href="#">Continue</a></button>
      </div>
    </div>
  </body>
</html>
